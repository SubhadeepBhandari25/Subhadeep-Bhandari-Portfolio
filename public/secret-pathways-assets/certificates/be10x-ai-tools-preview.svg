<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" width="100%" height="100%">
  <defs>
    <linearGradient id="be10xBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#fafafa"/>
    </linearGradient>
    <filter id="bShadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#000000" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect x="16" y="16" width="768" height="488" rx="16" fill="url(#be10xBg)" stroke="#111827" stroke-width="6" filter="url(#bShadow)"/>

  <!-- Left: be10x badge -->
  <g transform="translate(56, 50)">
    <circle cx="50" cy="40" r="40" fill="#111827"/>
    <text x="50" y="48" font-family="'Onest', sans-serif" font-size="22" font-weight="900" fill="#ffffff" text-anchor="middle">be10x</text>
  </g>

  <!-- Right: Grey Banner -->
  <g transform="translate(560, 24)">
    <rect x="0" y="0" width="180" height="340" fill="#e5e7eb" rx="10"/>
    <text x="90" y="44" font-family="'Onest', sans-serif" font-size="16" font-weight="900" fill="#111827" text-anchor="middle" letter-spacing="1">AI TOOLS</text>
    <text x="90" y="66" font-family="'Onest', sans-serif" font-size="16" font-weight="900" fill="#111827" text-anchor="middle" letter-spacing="1">WORKSHOP</text>

    <!-- Verified Rosette -->
    <circle cx="90" cy="140" r="45" fill="#ffffff" stroke="#111827" stroke-width="2.5"/>
    <text x="90" y="136" font-family="'Onest', sans-serif" font-size="16" font-weight="900" fill="#111827" text-anchor="middle">be10x</text>
    <text x="90" y="156" font-family="'Onest', sans-serif" font-size="10" font-weight="600" fill="#10b981" text-anchor="middle">✓ Verified</text>

    <text x="90" y="235" font-family="'Onest', sans-serif" font-size="12" font-weight="700" fill="#4b5563" text-anchor="middle">Issued on:</text>
    <text x="90" y="258" font-family="'Onest', sans-serif" font-size="14" font-weight="900" fill="#111827" text-anchor="middle">May 10th, 2026</text>
  </g>

  <!-- Main Content -->
  <g transform="translate(56, 160)">
    <text x="0" y="24" font-family="'Onest', sans-serif" font-size="34" font-weight="900" fill="#111827" letter-spacing="1">Certificate</text>
    <text x="0" y="50" font-family="'Onest', sans-serif" font-size="13" font-weight="600" fill="#4b5563">of Completion Awarded to</text>
    <text x="0" y="86" font-family="'Onest', sans-serif" font-size="28" font-weight="900" fill="#111827" letter-spacing="-0.5">SUBHADEEP BHANDARI</text>
    <text x="0" y="116" font-family="'Onest', sans-serif" font-size="13" fill="#4b5563">on successful completion of AI tools and ChatGPT workshop</text>

    <!-- Capabilities -->
    <rect x="0" y="132" width="460" height="90" rx="8" fill="#f3f4f6"/>
    <text x="16" y="156" font-family="'Onest', sans-serif" font-size="11" fill="#1f2937">• Create presentations using AI in under 5 min</text>
    <text x="16" y="180" font-family="'Onest', sans-serif" font-size="11" fill="#1f2937">• Analyse complex datasets using AI in under 30 min</text>
    <text x="16" y="204" font-family="'Onest', sans-serif" font-size="11" fill="#1f2937">• Code, refactor, and debug using AI in under 10 min</text>
  </g>

  <!-- Signatures -->
  <g transform="translate(56, 440)">
    <line x1="0" y1="0" x2="160" y2="0" stroke="#9ca3af" stroke-width="1.5"/>
    <text x="80" y="20" font-family="'Onest', sans-serif" font-size="11" font-weight="700" fill="#111827" text-anchor="middle">Aditya Goenka</text>
    <text x="80" y="34" font-family="'Onest', sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">Co-founder</text>

    <line x1="220" y1="0" x2="380" y2="0" stroke="#9ca3af" stroke-width="1.5"/>
    <text x="300" y="20" font-family="'Onest', sans-serif" font-size="11" font-weight="700" fill="#111827" text-anchor="middle">Aditya Kachave</text>
    <text x="300" y="34" font-family="'Onest', sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">Co-founder</text>
