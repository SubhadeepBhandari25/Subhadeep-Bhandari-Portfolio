<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a120e"/>
      <stop offset="50%" stop-color="#070b09"/>
      <stop offset="100%" stop-color="#040605"/>
    </linearGradient>
    <linearGradient id="cardGrad2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#14231b" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0c1611" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="areaGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0.0"/>
    </linearGradient>
  </defs>

  <rect width="800" height="500" fill="url(#bgGrad2)"/>
  <rect x="0" y="0" width="800" height="500" fill="none" stroke="rgba(223,231,224,0.08)" stroke-width="1"/>

  <!-- Top bar -->
  <rect x="24" y="24" width="752" height="48" rx="8" fill="url(#cardGrad2)" stroke="rgba(16,185,129,0.2)"/>
  <text x="44" y="53" font-family="'Onest', -apple-system, sans-serif" font-size="13" font-weight="600" fill="#dfe7e0" letter-spacing="0.05em">ANALYTICS &amp; PREDICTIVE DEMAND FORECASTING</text>
  <rect x="560" y="38" width="200" height="20" rx="4" fill="rgba(16,185,129,0.15)"/>
  <text x="572" y="52" font-family="'Onest', sans-serif" font-size="10" font-weight="500" fill="#34d399">7-DAY MOVING-AVERAGE REPLENISHMENT</text>

  <!-- Left: Time Series Plot -->
  <rect x="24" y="88" width="480" height="388" rx="8" fill="url(#cardGrad2)" stroke="rgba(223,231,224,0.06)"/>
  <text x="44" y="118" font-family="'Onest', sans-serif" font-size="13" font-weight="600" fill="#dfe7e0">Historical Checkout Velocity vs Safety Stock</text>
  <text x="44" y="136" font-family="'Onest', sans-serif" font-size="10" fill="#78837c">Pandas &amp; Plotly Embedded Series with Automatic Dynamic Reorder Trigger</text>

  <!-- Grid lines -->
  <line x1="50" y1="170" x2="480" y2="170" stroke="rgba(223,231,224,0.06)"/>
  <line x1="50" y1="230" x2="480" y2="230" stroke="rgba(223,231,224,0.06)"/>
  <line x1="50" y1="290" x2="480" y2="290" stroke="rgba(223,231,224,0.06)"/>
  <line x1="50" y1="350" x2="480" y2="350" stroke="rgba(223,231,224,0.06)"/>
  <line x1="50" y1="410" x2="480" y2="410" stroke="rgba(223,231,224,0.1)"/>

  <!-- Y axis labels -->
  <text x="42" y="174" font-family="'Onest', monospace" font-size="9" fill="#78837c" text-anchor="end">400</text>
  <text x="42" y="234" font-family="'Onest', monospace" font-size="9" fill="#78837c" text-anchor="end">300</text>
  <text x="42" y="294" font-family="'Onest', monospace" font-size="9" fill="#78837c" text-anchor="end">200</text>
  <text x="42" y="354" font-family="'Onest', monospace" font-size="9" fill="#78837c" text-anchor="end">100</text>
  <text x="42" y="414" font-family="'Onest', monospace" font-size="9" fill="#78837c" text-anchor="end">0</text>

  <!-- Area under chart -->
  <polygon points="50,410 50,330 110,310 170,260 230,280 290,220 350,190 410,210 470,170 470,410" fill="url(#areaGrad)"/>

  <!-- Chart line: Historical -->
  <polyline points="50,330 110,310 170,260 230,280 290,220 350,190 410,210 470,170" fill="none" stroke="#10b981" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Safety stock threshold (dotted) -->
  <line x1="50" y1="360" x2="480" y2="360" stroke="#ff5a3c" stroke-width="1.5" stroke-dasharray="4,4"/>
  <text x="475" y="354" font-family="'Onest', sans-serif" font-size="10" font-weight="500" fill="#ff5a3c" text-anchor="end">Safety Buffer: 80 units</text>

  <!-- X axis labels -->
  <text x="50" y="430" font-family="'Onest', monospace" font-size="9" fill="#78837c">Nov 01</text>
  <text x="120" y="430" font-family="'Onest', monospace" font-size="9" fill="#78837c">Nov 04</text>
  <text x="190" y="430" font-family="'Onest', monospace" font-size="9" fill="#78837c">Nov 07</text>
  <text x="260" y="430" font-family="'Onest', monospace" font-size="9" fill="#78837c">Nov 10</text>
  <text x="330" y="430" font-family="'Onest', monospace" font-size="9" fill="#78837c">Nov 13</text>
  <text x="400" y="430" font-family="'Onest', monospace" font-size="9" fill="#78837c">Nov 16</text>
  <text x="470" y="430" font-family="'Onest', monospace" font-size="9" fill="#10b981">Nov 19</text>

  <!-- Legend -->
  <rect x="50" y="446" width="10" height="10" rx="2" fill="#10b981"/>
  <text x="66" y="455" font-family="'Onest', sans-serif" font-size="10" fill="#dfe7e0">7-Day Moving Avg Demand</text>
  <line x1="220" y1="451" x2="235" y2="451" stroke="#ff5a3c" stroke-width="2" stroke-dasharray="3,3"/>
  <text x="242" y="455" font-family="'Onest', sans-serif" font-size="10" fill="#dfe7e0">Replenishment Point</text>

  <!-- Right: Key Architectural Highlights -->
  <rect x="520" y="88" width="256" height="388" rx="8" fill="url(#cardGrad2)" stroke="rgba(223,231,224,0.06)"/>
  <text x="540" y="118" font-family="'Onest', sans-serif" font-size="13" font-weight="600" fill="#dfe7e0">System Highlights</text>

  <!-- Item 1 -->
  <circle cx="548" cy="154" r="4" fill="#10b981"/>
  <text x="562" y="150" font-family="'Onest', sans-serif" font-size="12" font-weight="600" fill="#dfe7e0">Atomic Checkout</text>
  <text x="562" y="168" font-family="'Onest', sans-serif" font-size="10" fill="#aab4ad">ACID-compliant stock deduction prevents negative balances under concurrent checkouts.</text>

  <!-- Item 2 -->
  <circle cx="548" cy="214" r="4" fill="#34d399"/>
  <text x="562" y="210" font-family="'Onest', sans-serif" font-size="12" font-weight="600" fill="#dfe7e0">Inventory Movement Ledger</text>
  <text x="562" y="228" font-family="'Onest', sans-serif" font-size="10" fill="#aab4ad">Complete audit trail of all manual adjustments, sales deductions, and vendor receipts.</text>

  <!-- Item 3 -->
  <circle cx="548" cy="274" r="4" fill="#c9a24a"/>
  <text x="562" y="270" font-family="'Onest', sans-serif" font-size="12" font-weight="600" fill="#dfe7e0">Formula-Injection Defense</text>
  <text x="562" y="288" font-family="'Onest', sans-serif" font-size="10" fill="#aab4ad">Strict CSV sanitization strips rogue spreadsheet formulas (=, +, -, @) during batch imports.</text>

  <!-- Item 4 -->
  <circle cx="548" cy="334" r="4" fill="#e0231c"/>
  <text x="562" y="330" font-family="'Onest', sans-serif" font-size="12" font-weight="600" fill="#dfe7e0">Pytest Test Suite</text>
  <text x="562" y="348" font-family="'Onest', sans-serif" font-size="10" fill="#aab4ad">Comprehensive test fixtures validating edge cases, authorization rules, and session state.</text>

  <!-- Item 5: Tech stack chips -->
  <rect x="540" y="380" width="216" height="76" rx="6" fill="rgba(0,0,0,0.3)"/>
  <text x="550" y="400" font-family="'Onest', sans-serif" font-size="10" font-weight="600" fill="#78837c">CORE STACK</text>
  <text x="550" y="420" font-family="'Onest', sans-serif" font-size="11" fill="#dfe7e0">Python · Flask · SQLAlchemy · Pandas</text>
  <text x="550" y="438" font-family="'Onest', sans-serif" font-size="11" fill="#34d399">Plotly · Pytest · Vanilla JS · HTML/CSS</text>
</svg>