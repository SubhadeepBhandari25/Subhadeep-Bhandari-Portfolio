<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a120e"/>
      <stop offset="50%" stop-color="#070b09"/>
      <stop offset="100%" stop-color="#040605"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#14231b" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0c1611" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="greenAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="vermilionAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e0231c"/>
      <stop offset="100%" stop-color="#ff5a3c"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" fill="url(#bgGrad)"/>
  <rect x="0" y="0" width="800" height="500" fill="none" stroke="rgba(223,231,224,0.08)" stroke-width="1"/>

  <!-- Top bar -->
  <rect x="24" y="24" width="752" height="48" rx="8" fill="url(#cardGrad)" stroke="rgba(16,185,129,0.2)"/>
  <circle cx="50" cy="48" r="6" fill="#10b981"/>
  <circle cx="68" cy="48" r="6" fill="#c9a24a"/>
  <circle cx="86" cy="48" r="6" fill="#e0231c"/>
  <text x="110" y="53" font-family="'Onest', -apple-system, sans-serif" font-size="13" font-weight="600" fill="#dfe7e0" letter-spacing="0.05em">GREENLEAF NEXUS · INVENTORY &amp; SALES ENGINE</text>
  <rect x="630" y="38" width="130" height="20" rx="4" fill="rgba(16,185,129,0.15)"/>
  <text x="642" y="52" font-family="'Onest', sans-serif" font-size="10" font-weight="500" fill="#34d399">● ATOMIC TRANSACTIONS</text>

  <!-- Metric 1: Stock Value -->
  <rect x="24" y="88" width="234" height="88" rx="8" fill="url(#cardGrad)" stroke="rgba(223,231,224,0.06)"/>
  <text x="44" y="112" font-family="'Onest', sans-serif" font-size="11" fill="#78837c" letter-spacing="0.08em">TOTAL ACTIVE INVENTORY</text>
  <text x="44" y="146" font-family="'Onest', sans-serif" font-size="28" font-weight="600" fill="#dfe7e0">4,820 <tspan font-size="14" fill="#10b981">SKUs</tspan></text>
  <text x="44" y="164" font-family="'Onest', sans-serif" font-size="10" fill="#10b981">↑ Atomic deduction active</text>

  <!-- Metric 2: Daily Sales -->
  <rect x="282" y="88" width="234" height="88" rx="8" fill="url(#cardGrad)" stroke="rgba(223,231,224,0.06)"/>
  <text x="302" y="112" font-family="'Onest', sans-serif" font-size="11" fill="#78837c" letter-spacing="0.08em">CHECKOUT VELOCITY</text>
  <text x="302" y="146" font-family="'Onest', sans-serif" font-size="28" font-weight="600" fill="#dfe7e0">142 <tspan font-size="14" fill="#aab4ad">orders/hr</tspan></text>
  <text x="302" y="164" font-family="'Onest', sans-serif" font-size="10" fill="#c9a24a">Role: Cashier &amp; Admin RBAC</text>

  <!-- Metric 3: Critical Alerts -->
  <rect x="540" y="88" width="236" height="88" rx="8" fill="url(#cardGrad)" stroke="rgba(224,35,28,0.2)"/>
  <text x="560" y="112" font-family="'Onest', sans-serif" font-size="11" fill="#e0231c" letter-spacing="0.08em">SAFETY-STOCK ALERTS</text>
  <text x="560" y="146" font-family="'Onest', sans-serif" font-size="28" font-weight="600" fill="#ff5a3c">3 <tspan font-size="14" fill="#aab4ad">Low Items</tspan></text>
  <text x="560" y="164" font-family="'Onest', sans-serif" font-size="10" fill="#ff5a3c">Near-expiry alert triggered</text>

  <!-- Inventory Ledger Table View -->
  <rect x="24" y="192" width="752" height="284" rx="8" fill="url(#cardGrad)" stroke="rgba(223,231,224,0.06)"/>
  <text x="44" y="222" font-family="'Onest', sans-serif" font-size="13" font-weight="600" fill="#dfe7e0">REAL-TIME INVENTORY MOVEMENT LEDGER</text>
  <text x="580" y="222" font-family="'Onest', sans-serif" font-size="11" fill="#78837c">Sanitized CSV Export Ready</text>
  <line x1="44" y1="236" x2="756" y2="236" stroke="rgba(223,231,224,0.1)"/>

  <!-- Table Header -->
  <text x="44" y="258" font-family="'Onest', sans-serif" font-size="10" font-weight="600" fill="#78837c">SKU ID</text>
  <text x="140" y="258" font-family="'Onest', sans-serif" font-size="10" font-weight="600" fill="#78837c">ITEM NAME</text>
  <text x="320" y="258" font-family="'Onest', sans-serif" font-size="10" font-weight="600" fill="#78837c">CATEGORY</text>
  <text x="460" y="258" font-family="'Onest', sans-serif" font-size="10" font-weight="600" fill="#78837c">STOCK</text>
  <text x="570" y="258" font-family="'Onest', sans-serif" font-size="10" font-weight="600" fill="#78837c">REORDER POINT</text>
  <text x="690" y="258" font-family="'Onest', sans-serif" font-size="10" font-weight="600" fill="#78837c">STATUS</text>

  <!-- Row 1 -->
  <line x1="44" y1="272" x2="756" y2="272" stroke="rgba(223,231,224,0.04)"/>
  <text x="44" y="296" font-family="'Onest', monospace" font-size="12" fill="#dfe7e0">GL-8921</text>
  <text x="140" y="296" font-family="'Onest', sans-serif" font-size="12" font-weight="500" fill="#dfe7e0">Arabica Cold Brew Blend</text>
  <text x="320" y="296" font-family="'Onest', sans-serif" font-size="12" fill="#aab4ad">Beverage Essentials</text>
  <text x="460" y="296" font-family="'Onest', monospace" font-size="12" fill="#34d399">184 units</text>
  <text x="570" y="296" font-family="'Onest', monospace" font-size="12" fill="#aab4ad">50 units</text>
  <rect x="686" y="282" width="60" height="18" rx="3" fill="rgba(16,185,129,0.15)"/>
  <text x="696" y="295" font-family="'Onest', sans-serif" font-size="10" font-weight="600" fill="#10b981">OPTIMAL</text>

  <!-- Row 2 -->
  <line x1="44" y1="312" x2="756" y2="312" stroke="rgba(223,231,224,0.04)"/>
  <text x="44" y="336" font-family="'Onest', monospace" font-size="12" fill="#dfe7e0">GL-4412</text>
  <text x="140" y="336" font-family="'Onest', sans-serif" font-size="12" font-weight="500" fill="#dfe7e0">Organic Matcha Powder Grade A</text>
  <text x="320" y="336" font-family="'Onest', sans-serif" font-size="12" fill="#aab4ad">Specialty Tea</text>
  <text x="460" y="336" font-family="'Onest', monospace" font-size="12" fill="#ff5a3c">12 units</text>
  <text x="570" y="336" font-family="'Onest', monospace" font-size="12" fill="#aab4ad">30 units</text>
  <rect x="686" y="322" width="60" height="18" rx="3" fill="rgba(224,35,28,0.2)"/>
  <text x="694" y="335" font-family="'Onest', sans-serif" font-size="10" font-weight="600" fill="#ff5a3c">LOW STOCK</text>

  <!-- Row 3 -->
  <line x1="44" y1="352" x2="756" y2="352" stroke="rgba(223,231,224,0.04)"/>
  <text x="44" y="376" font-family="'Onest', monospace" font-size="12" fill="#dfe7e0">GL-1098</text>
  <text x="140" y="376" font-family="'Onest', sans-serif" font-size="12" font-weight="500" fill="#dfe7e0">Almond Flour Gluten-Free</text>
  <text x="320" y="376" font-family="'Onest', sans-serif" font-size="12" fill="#aab4ad">Bakery Dry Goods</text>
  <text x="460" y="376" font-family="'Onest', monospace" font-size="12" fill="#34d399">94 units</text>
  <text x="570" y="376" font-family="'Onest', monospace" font-size="12" fill="#aab4ad">25 units</text>
  <rect x="686" y="362" width="60" height="18" rx="3" fill="rgba(16,185,129,0.15)"/>
  <text x="696" y="375" font-family="'Onest', sans-serif" font-size="10" font-weight="600" fill="#10b981">OPTIMAL</text>

  <!-- Row 4 -->
  <line x1="44" y1="392" x2="756" y2="392" stroke="rgba(223,231,224,0.04)"/>
  <text x="44" y="416" font-family="'Onest', monospace" font-size="12" fill="#dfe7e0">GL-7720</text>
  <text x="140" y="416" font-family="'Onest', sans-serif" font-size="12" font-weight="500" fill="#dfe7e0">Madagascar Bourbon Vanilla</text>
  <text x="320" y="416" font-family="'Onest', sans-serif" font-size="12" fill="#aab4ad">Extracts &amp; Spices</text>
  <text x="460" y="416" font-family="'Onest', monospace" font-size="12" fill="#c9a24a">24 units</text>
  <text x="570" y="416" font-family="'Onest', monospace" font-size="12" fill="#aab4ad">20 units</text>
  <rect x="686" y="402" width="60" height="18" rx="3" fill="rgba(201,162,74,0.15)"/>
  <text x="694" y="415" font-family="'Onest', sans-serif" font-size="10" font-weight="600" fill="#c9a24a">EXPIRING</text>

  <!-- Footer note -->
  <text x="44" y="454" font-family="'Onest', sans-serif" font-size="11" fill="#78837c">Built with Flask · SQLAlchemy · Pytest Suite · SQLite/PostgreSQL Engine · Secure CSV Import/Export</text>
</svg>