<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" width="100%" height="100%">
  <defs>
    <linearGradient id="tataBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f8fafc"/>
    </linearGradient>
    <filter id="cardShadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#000000" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Certificate Border Card -->
  <rect x="16" y="16" width="768" height="488" rx="16" fill="url(#tataBg)" stroke="#0284c7" stroke-width="6" filter="url(#cardShadow)"/>

  <!-- Left Header: Tata logo -->
  <g transform="translate(56, 50)">
    <circle cx="22" cy="22" r="22" fill="#0284c7"/>
    <path d="M12 18 L22 18 L22 30 M22 18 L32 18" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
    <text x="54" y="27" font-family="'Onest', -apple-system, sans-serif" font-size="24" font-weight="900" fill="#0f172a" letter-spacing="4">TATA</text>
  </g>

  <!-- Right Header: Forage Banner -->
  <g transform="translate(560, 36)">
    <path d="M0 0 L160 0 L160 100 L80 120 L0 100 Z" fill="#0284c7"/>
    <text x="44" y="32" font-family="'Onest', sans-serif" font-size="20" font-weight="900" fill="#ffffff">Forage</text>
    <text x="24" y="62" font-family="'Onest', sans-serif" font-size="9" font-weight="600" fill="#e0f2fe" text-anchor="start">Inspiring and</text>
    <text x="24" y="74" font-family="'Onest', sans-serif" font-size="9" font-weight="600" fill="#e0f2fe" text-anchor="start">empowering</text>
    <text x="24" y="86" font-family="'Onest', sans-serif" font-size="9" font-weight="600" fill="#e0f2fe" text-anchor="start">future professionals</text>
  </g>

  <!-- Body Content -->
  <g transform="translate(56, 150)">
    <text x="0" y="38" font-family="'Onest', sans-serif" font-size="34" font-weight="900" fill="#0f172a" letter-spacing="-0.5">Subhadeep Bhandari</text>
    <text x="0" y="74" font-family="'Onest', sans-serif" font-size="20" font-weight="700" fill="#0284c7">GenAI Powered Data Analytics Job Simulation</text>
    <text x="0" y="104" font-family="'Onest', sans-serif" font-size="14" font-weight="600" fill="#475569">Certificate of Completion • November 14th, 2026</text>

    <!-- Practical Tasks bullet box -->
    <rect x="0" y="124" width="460" height="130" rx="8" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1.5"/>
    <text x="16" y="146" font-family="'Onest', sans-serif" font-size="11" font-weight="700" fill="#334155">Completed Practical Industry Tasks:</text>
    <text x="24" y="168" font-family="'Onest', sans-serif" font-size="11" fill="#475569">• Exploratory data analysis & risk profiling</text>
    <text x="24" y="188" font-family="'Onest', sans-serif" font-size="11" fill="#475569">• Predicting delinquency with AI models</text>
    <text x="24" y="208" font-family="'Onest', sans-serif" font-size="11" fill="#475569">• Business reporting and data storytelling for collections</text>
    <text x="24" y="228" font-family="'Onest', sans-serif" font-size="11" fill="#475569">• Implementing an AI-driven collections strategy</text>
  </g>

  <!-- Signature & Verification Footer -->
  <g transform="translate(56, 440)">
    <line x1="0" y1="0" x2="688" y2="0" stroke="#cbd5e1" stroke-width="1"/>
    <text x="0" y="24" font-family="'JetBrains Mono', monospace" font-size="10" fill="#64748b">Enrolment: 6ae3a90640463a9e7b3fef8c | User: 6ad44ba551a640ee73311bc1</text>
    <text x="688" y="24" font-family="'Onest', sans-serif" font-size="11" font-weight="700" fill="#0284c7" text-anchor="end">Verified via Forage</text>
  </g>
</svg>